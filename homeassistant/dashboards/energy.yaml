# "Energy" dashboard (sections view), as running on the reference installation, in English.
# Native cards + one community card: power-flow-card-plus (Settings -> Marketplace).
# Create a new dashboard, open the raw configuration editor and paste this file.
title: Energy
views:
  - title: Energy
    path: energy
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Right now
            icon: mdi:flash
          - type: custom:power-flow-card-plus
            entities:
              grid:
                entity: sensor.grid_power            # + import, - export
                name: Grid
              solar:
                entity: sensor.pv_power
                name: Solar
              battery:
                entity: sensor.battery_power         # + discharge, - charge
                state_of_charge: sensor.solaredge_battery_soe
                name: Battery
              home:
                entity: sensor.house_power
                name: Home
                override_state: true
              individual:
                - entity: sensor.keba_charging_power
                  name: Charger
                  icon: mdi:ev-station
                  display_zero: true
            watt_threshold: 1000
            kw_decimals: 2
            clickable_entities: true
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: Charger
            icon: mdi:ev-station
          - type: tile
            entity: sensor.keba_charging_power
            name: Power
            icon: mdi:car-electric
            color: cyan
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.keba_charging_state
            name: State
            icon: mdi:ev-plug-type2
            color: grey
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.keba_session_energy
            name: Session
            icon: mdi:counter
            color: cyan
            grid_options: {columns: 6}
          - type: tile
            entity: number.charger_maximum_current   # OCPP integration
            name: Max current
            icon: mdi:current-ac
            color: cyan
            grid_options: {columns: 6}
          - type: tile
            entity: switch.charger_charge_control    # OCPP integration
            name: Charging
            color: green
            tap_action: {action: none}
            icon_tap_action: {action: none}
            grid_options: {columns: 12}

      - type: grid
        cards:
          - type: heading
            heading: Today
            icon: mdi:calendar-today
          - type: energy-date-selection
            grid_options: {columns: 12}
          - type: energy-distribution
            link_dashboard: true
            grid_options: {columns: 12}

      - type: grid
        cards:
          - type: heading
            heading: Power, last 24 h
            icon: mdi:chart-line
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.pv_power
                name: Solar
              - entity: sensor.house_power
                name: Home
              - entity: sensor.grid_power
                name: Grid
              - entity: sensor.battery_power
                name: Battery
              - entity: sensor.keba_charging_power
                name: Charger
            grid_options: {columns: 12}

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Energy
            icon: mdi:chart-bar
          - type: energy-usage-graph
            grid_options: {columns: 12}
          - type: energy-solar-graph
            grid_options: {columns: 12}
