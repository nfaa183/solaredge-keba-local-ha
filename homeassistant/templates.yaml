# Template sensors and integrals used by this setup.
#
# In my installation these were created from the UI (Helpers -> Template / Integral), and the two
# sign-inverted sensors are the "_inverted" entities Home Assistant creates when you tick
# "Inverted" on a power sensor in the Energy dashboard. This file is the portable YAML equivalent.
#
# ADAPT the source entity ids to yours (they depend on device names and on the HA language):
#   sensor.solaredge_se10k_dc_power   inverter DC power (W)
#   sensor.battery_1_dc_power         battery DC power (W), SolarEdge sign: + charging, - discharging
#   sensor.meter_1_power              grid meter power (W), SolarEdge sign: + export, - import
#   binary_sensor.keba_charging / binary_sensor.keba_vehicle_connected   from keba_one_ev

template:
  - sensor:
      # PV production on the DC side (the inverter counter also counts battery discharge)
      - name: "PV power"
        unique_id: pv_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set dc_inv = states('sensor.solaredge_se10k_dc_power') | float(none) %}
          {% set dc_bat = states('sensor.battery_1_dc_power') | float(none) %}
          {% if dc_inv is none or dc_bat is none %}
            {{ none }}
          {% else %}
            {{ [dc_inv + dc_bat, 0] | max | round(0) }}
          {% endif %}

      # Grid power, positive = import (what Home Assistant and evcc expect)
      - name: "Grid power"
        unique_id: grid_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.meter_1_power') | float(none) %}
          {{ none if p is none else (-p) | round(0) }}

      # Battery power, positive = discharge (what Home Assistant and evcc expect)
      - name: "Battery power"
        unique_id: battery_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.battery_1_dc_power') | float(none) %}
          {{ none if p is none else (-p) | round(0) }}

      # Battery charge / discharge power split, source of the energy integrals below
      - name: "Battery charge power"
        unique_id: battery_charge_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.battery_1_dc_power') | float(none) %}
          {{ none if p is none else [p, 0] | max | round(0) }}

      - name: "Battery discharge power"
        unique_id: battery_discharge_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.battery_1_dc_power') | float(none) %}
          {{ none if p is none else [-p, 0] | max | round(0) }}

      # House consumption = PV + grid import + battery discharge
      - name: "House power"
        unique_id: house_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set pv = states('sensor.pv_power') | float(none) %}
          {% set g = states('sensor.grid_power') | float(none) %}
          {% set b = states('sensor.battery_power') | float(none) %}
          {% if pv is none or g is none or b is none %}
            {{ none }}
          {% else %}
            {{ [pv + g + b, 0] | max | round(0) }}
          {% endif %}

      # Charger status in evcc format: A = no vehicle, B = connected, C = charging
      - name: "Charger status evcc"
        unique_id: charger_status_evcc
        state: >
          {% if is_state('binary_sensor.keba_charging', 'on') %}C
          {% elif is_state('binary_sensor.keba_vehicle_connected', 'on') %}B
          {% else %}A{% endif %}

# Energy counters recomputed from power (Riemann sum)
sensor:
  - platform: integration
    name: "PV energy"
    unique_id: pv_energy
    source: sensor.pv_power
    method: left
    unit_prefix: k
    unit_time: h
    round: 3

  - platform: integration
    name: "Battery energy charged"
    unique_id: battery_energy_charged
    source: sensor.battery_charge_power
    method: left
    unit_prefix: k
    unit_time: h
    round: 3

  - platform: integration
    name: "Battery energy discharged"
    unique_id: battery_energy_discharged
    source: sensor.battery_discharge_power
    method: left
    unit_prefix: k
    unit_time: h
    round: 3
